name: netflix_clone
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts:
  video_player: ^2.11.1
  bordered_text: ^3.0.2
  build_runner: ^2.15.1
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  dartz: ^0.10.1
  injectable_generator: 
  get_it: 
  injectable:
  cached_network_image: ^3.4.1
  flutter_debouncer: ^2.1.1
  share_plus: ^13.3.1
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

